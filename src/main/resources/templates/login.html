<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | TacnaVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/sistema.css}">
</head>
<body class="login">

  <main class="tarjeta">
    <div class="encabezado">
      <img th:src="@{/galeria/logo.png}" alt="Logo TacnaVet" style="height:56px;margin:0 auto 12px;border-radius:8px;display:block;">
      <h1>TacnaVet</h1>
      <p>Ingresa tus credenciales para acceder al sistema</p>
    </div>

    <div class="login-error" th:if="${error != null}">
      <span class="ico">error</span>
      <p th:text="${error}">Mensaje de error</p>
    </div>

    <form class="formulario" th:action="@{/login}" method="post">
      <div class="grupo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" class="entrada"
               placeholder="admin@tacnavet.com" th:value="${correo}" required autofocus>
      </div>
      <div class="grupo">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" class="entrada"
               placeholder="••••••••" required>
      </div>
      <button type="submit" class="boton">
        <span class="ico" style="font-size:18px;">login</span>
        Ingresar
      </button>
    </form>

    <p class="registro"><a th:href="@{/}">&larr; Volver al sitio web</a></p>
  </main>

</body>
</html>
