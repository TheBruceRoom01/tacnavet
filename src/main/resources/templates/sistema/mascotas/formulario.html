<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Mascota | TacnaVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/sistema.css}">
</head>
<body class="sis-body">
<div class="sis-layout">

  <div th:replace="~{fragments/layout-sistema :: sidebar('mascotas')}"></div>

  <div class="sis-principal">
    <div th:replace="~{fragments/layout-sistema :: topbar('Gestión de Mascotas')}"></div>

    <main class="sis-contenido">
      <div class="sis-card">
        <div class="sis-card-head">
          <h2 class="sis-card-tit"
              th:text="${mascota.id != null} ? 'Editar mascota' : 'Registrar nueva mascota'">Registrar mascota</h2>
          <a th:href="@{/sistema/mascotas}" class="btn btn-borde">
            <span class="ico">arrow_back</span> Volver
          </a>
        </div>

        <form class="sis-form" th:action="@{/sistema/mascotas/guardar}"
              th:object="${mascota}" method="post">

          <input type="hidden" th:field="*{id}">

          <div class="sis-form-grid">
            <div class="form-grupo">
              <label class="form-label" for="nombre">Nombre de la mascota *</label>
              <input type="text" id="nombre" class="form-input" th:field="*{nombre}"
                     placeholder="Ej. Tatto" required>
            </div>

            <div class="form-grupo">
              <label class="form-label" for="clienteId">Dueño (cliente) *</label>
              <select id="clienteId" name="clienteId" class="form-select" required>
                <option value="" th:selected="${mascota.cliente == null}">— Seleccione un dueño —</option>
                <option th:each="c : ${clientes}" th:value="${c.id}"
                        th:text="${c.nombres} + ' ' + ${c.apellidos}"
                        th:selected="${mascota.cliente != null and mascota.cliente.id == c.id}">Cliente</option>
              </select>
            </div>

            <div class="form-grupo">
              <label class="form-label" for="especie">Especie *</label>
              <select id="especie" class="form-select" th:field="*{especie}" required>
                <option value="Perro">Perro</option>
                <option value="Gato">Gato</option>
                <option value="Conejo">Conejo</option>
                <option value="Ave">Ave</option>
                <option value="Otro">Otro</option>
              </select>
            </div>

            <div class="form-grupo">
              <label class="form-label" for="raza">Raza</label>
              <input type="text" id="raza" class="form-input" th:field="*{raza}"
                     placeholder="Ej. Shih Tzu">
            </div>

            <div class="form-grupo">
              <label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
              <input type="date" id="fechaNacimiento" class="form-input" th:field="*{fechaNacimiento}">
            </div>

            <div class="form-grupo">
              <label class="form-label" for="sexo">Sexo</label>
              <select id="sexo" class="form-select" th:field="*{sexo}">
                <option value="M">Macho (M)</option>
                <option value="H">Hembra (H)</option>
              </select>
            </div>

            <div class="form-grupo">
              <label class="form-label" for="pesoKg">Peso (kg)</label>
              <input type="number" step="0.01" min="0" id="pesoKg" class="form-input"
                     th:field="*{pesoKg}" placeholder="Ej. 6.50">
            </div>
          </div>

          <div class="sis-form-botones">
            <button type="submit" class="btn btn-prim">
              <span class="ico">save</span> Guardar Mascota
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
</body>
</html>
