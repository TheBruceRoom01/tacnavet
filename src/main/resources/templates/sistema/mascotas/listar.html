<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Mascotas | TacnaVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/sistema.css}">
</head>
<body class="sis-body">
<div class="sis-layout">

  <div th:replace="~{fragments/layout-sistema :: sidebar('mascotas')}"></div>

  <div class="sis-principal">
    <div th:replace="~{fragments/layout-sistema :: topbar('Gestión de Mascotas')}"></div>

    <main class="sis-contenido">

      <div class="sis-alerta-error" th:if="${param.errorFK != null}">
        <span class="ico">error</span>
        No se puede eliminar: esta mascota tiene citas registradas.
      </div>

      <div class="sis-card">
        <div class="sis-card-head">
          <h2 class="sis-card-tit">Listado de mascotas</h2>
          <a th:href="@{/sistema/mascotas/nuevo}" class="btn btn-prim">
            <span class="ico">add</span> Nueva Mascota
          </a>
        </div>

        <div class="sis-tabla-wrap">
          <table class="sis-tabla">
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Especie</th>
                <th>Raza</th>
                <th>Dueño</th>
                <th>Sexo</th>
                <th>Peso (kg)</th>
                <th>Nacimiento</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="m, i : ${mascotas}">
                <td th:text="${i.count}">1</td>
                <td th:text="${m.nombre}">Tatto</td>
                <td th:text="${m.especie}">Perro</td>
                <td th:text="${m.raza != null} ? ${m.raza} : '—'">Shih Tzu</td>
                <td th:text="${m.cliente.nombres} + ' ' + ${m.cliente.apellidos}">Fredy Quispe</td>
                <td th:text="${m.sexo != null} ? ${m.sexo} : '—'">M</td>
                <td th:text="${m.pesoKg != null} ? ${m.pesoKg} : '—'">6.50</td>
                <td th:text="${m.fechaNacimiento != null} ? ${#temporals.format(m.fechaNacimiento,'dd/MM/yyyy')} : '—'">12/04/2023</td>
                <td class="sis-acciones">
                  <a th:href="@{/sistema/mascotas/editar/{id}(id=${m.id})}" class="sis-btn sis-btn-editar">
                    <span class="ico">edit</span> Editar
                  </a>
                  <a th:href="@{/sistema/mascotas/eliminar/{id}(id=${m.id})}" class="sis-btn sis-btn-eliminar"
                     onclick="return confirm('¿Seguro de eliminar esta mascota?')">
                    <span class="ico">delete</span> Eliminar
                  </a>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(mascotas)}">
                <td colspan="9" class="sis-vacio">No hay mascotas registradas</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>
</body>
</html>
