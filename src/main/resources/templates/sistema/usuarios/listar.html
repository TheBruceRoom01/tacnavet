<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios | TacnaVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/sistema.css}">
</head>
<body class="sis-body">
<div class="sis-layout">

  <div th:replace="~{fragments/layout-sistema :: sidebar('usuarios')}"></div>

  <div class="sis-principal">
    <div th:replace="~{fragments/layout-sistema :: topbar('Gestión de Usuarios')}"></div>

    <main class="sis-contenido">

      <div class="sis-alerta-error" th:if="${param.errorFK != null}">
        <span class="ico">error</span>
        No se puede eliminar: este usuario tiene citas registradas.
      </div>

      <div class="sis-card">
        <div class="sis-card-head">
          <h2 class="sis-card-tit">Listado de usuarios</h2>
          <a th:href="@{/sistema/usuarios/nuevo}" class="btn btn-prim">
            <span class="ico">person_add</span> Nuevo Usuario
          </a>
        </div>

        <div class="sis-tabla-wrap">
          <table class="sis-tabla">
            <thead>
              <tr>
                <th>#</th>
                <th>Nombres</th>
                <th>Apellidos</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Teléfono</th>
                <th>Registro</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="u, i : ${usuarios}">
                <td th:text="${i.count}">1</td>
                <td th:text="${u.nombres}">María</td>
                <td th:text="${u.apellidos}">Flores</td>
                <td th:text="${u.correo}">maria@tacnavet.com</td>
                <td>
                  <span class="sis-rol"
                        th:classappend="'sis-rol-' + ${#strings.toLowerCase(u.rol)}"
                        th:text="${u.rol}">VETERINARIO</span>
                </td>
                <td th:text="${u.telefono != null} ? ${u.telefono} : '—'">952123456</td>
                <td th:text="${#temporals.format(u.fechaRegistro,'dd/MM/yyyy')}">15/01/2026</td>
                <td class="sis-acciones">
                  <a th:href="@{/sistema/usuarios/editar/{id}(id=${u.id})}" class="sis-btn sis-btn-editar">
                    <span class="ico">edit</span> Editar
                  </a>
                  <a th:href="@{/sistema/usuarios/eliminar/{id}(id=${u.id})}" class="sis-btn sis-btn-eliminar"
                     onclick="return confirm('¿Seguro de eliminar este usuario?')">
                    <span class="ico">delete</span> Eliminar
                  </a>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="8" class="sis-vacio">No hay usuarios registrados</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>
</body>
</html>
