<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Usuario | TacnaVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/sistema.css}">
</head>
<body class="sis-body">
<div class="sis-layout">

  <div th:replace="~{fragments/layout-sistema :: sidebar('usuarios')}"></div>

  <div class="sis-principal">
    <div th:replace="~{fragments/layout-sistema :: topbar('Gestión de Usuarios')}"></div>

    <main class="sis-contenido">
      <div class="sis-card">
        <div class="sis-card-head">
          <h2 class="sis-card-tit"
              th:text="${usuario.id != null} ? 'Editar usuario' : 'Registrar nuevo usuario'">Registrar usuario</h2>
          <a th:href="@{/sistema/usuarios}" class="btn btn-borde">
            <span class="ico">arrow_back</span> Volver
          </a>
        </div>

        <form class="sis-form" th:action="@{/sistema/usuarios/guardar}"
              th:object="${usuario}" method="post">

          <input type="hidden" th:field="*{id}">

          <div class="sis-form-grid">
            <div class="form-grupo">
              <label class="form-label" for="nombres">Nombres *</label>
              <input type="text" id="nombres" class="form-input" th:field="*{nombres}"
                     placeholder="Ej. María" required>
            </div>

            <div class="form-grupo">
              <label class="form-label" for="apellidos">Apellidos *</label>
              <input type="text" id="apellidos" class="form-input" th:field="*{apellidos}"
                     placeholder="Ej. Flores Quispe" required>
            </div>

            <div class="form-grupo">
              <label class="form-label" for="correo">Correo electrónico *</label>
              <input type="email" id="correo" class="form-input" th:field="*{correo}"
                     placeholder="correo@tacnavet.com" required>
            </div>

            <div class="form-grupo">
              <label class="form-label" for="contrasena">Contraseña *</label>
              <input type="text" id="contrasena" class="form-input" th:field="*{contrasena}"
                     placeholder="Mínimo 6 caracteres" required minlength="4">
            </div>

            <div class="form-grupo">
              <label class="form-label" for="rol">Rol *</label>
              <select id="rol" class="form-select" th:field="*{rol}" required>
                <option value="ADMIN">Administrador</option>
                <option value="VETERINARIO">Veterinario</option>
                <option value="RECEPCIONISTA">Recepcionista</option>
              </select>
            </div>

            <div class="form-grupo">
              <label class="form-label" for="telefono">Teléfono</label>
              <input type="tel" id="telefono" class="form-input" th:field="*{telefono}"
                     placeholder="952123456">
            </div>
          </div>

          <div class="sis-form-botones">
            <button type="submit" class="btn btn-prim">
              <span class="ico">save</span> Guardar Usuario
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
</body>
</html>
